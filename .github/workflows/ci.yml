name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,google_adk,mcp]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Build indexes for all bundled examples
        run: |
          for repo in \
            examples/customer_bp_model \
            examples/supplier_vendor_model \
            examples/simple_product_model \
            examples/generic_product_model \
            examples/sap_bp_customer_vendor_reference \
            examples/synthetic_customer_migration_demo \
            examples/synthetic_enterprise_portfolio_demo \
            examples/northstar_mobility_pilot; do
            echo "== build-index ${repo}"
            modelops build-index --repo "${repo}" --jsonl
          done

      - name: Test with coverage
        run: python -m pytest --cov=modelops_core --cov-report=term-missing --cov-fail-under=70

      - name: Validate all bundled examples
        run: |
          for repo in \
            examples/customer_bp_model \
            examples/supplier_vendor_model \
            examples/simple_product_model \
            examples/generic_product_model \
            examples/sap_bp_customer_vendor_reference \
            examples/synthetic_customer_migration_demo \
            examples/synthetic_enterprise_portfolio_demo \
            examples/northstar_mobility_pilot; do
            echo "== validate ${repo}"
            modelops validate --repo "${repo}"
          done

      - name: Release smoke checks
        run: bash scripts/release_smoke.sh

      - name: Build packaged Workbench assets
        run: |
          npm --prefix frontend ci
          bash scripts/build_workbench_assets.sh

      - name: Docs command-snippet freshness
        run: python scripts/validate_doc_commands.py

      - name: Factory harness gates (lint, docs)
        run: ./factory validate --gates lint,docs --json

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Lint frontend (if configured)
        run: |
          if grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "No lint script configured; skipping"
          fi

  windows-wheel-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install the wheel in a path with spaces
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          $venv = Join-Path $env:RUNNER_TEMP 'Martenweave Wheel Smoke'
          python -m venv $venv
          & "$venv\Scripts\python.exe" -m pip install $wheel.FullName
          & "$venv\Scripts\martenweave.exe" --version
          $repo = Join-Path $env:RUNNER_TEMP 'Martenweave Wheel Smoke\starter repo'
          & "$venv\Scripts\martenweave.exe" init $repo --template business_partner
          & "$venv\Scripts\martenweave.exe" validate --repo $repo
          & "$venv\Scripts\martenweave.exe" build-index --repo $repo
          & "$venv\Scripts\python.exe" -c "from importlib.resources import files; assert (files('modelops_core') / 'workbench_static' / 'index.html').is_file()"
